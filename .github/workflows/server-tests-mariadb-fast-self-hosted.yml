name: Server (MariaDB Fast Self-hosted)

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.js"
      - "**.css"
      - "**.svg"
      - "**.md"
      - "**.html"
      - "crowdin.yml"
      - ".coderabbit.yml"
      - ".mergify.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: server-mariadb-fast-self-hosted-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check-author:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    outputs:
      trusted: ${{ steps.check.outputs.trusted }}
      permission: ${{ steps.check.outputs.permission }}
    steps:
      - id: check
        uses: actions/github-script@v7
        with:
          script: |
            const username = context.payload.pull_request.user.login;
            const { owner, repo } = context.repo;

            let permission = "none";
            try {
              const res = await github.rest.repos.getCollaboratorPermissionLevel({
                owner,
                repo,
                username,
              });
              permission = res.data.permission;
            } catch (e) {
              if (e.status !== 404) throw e;
            }

            const trusted = ["write", "maintain", "admin"].includes(permission);
            core.setOutput("permission", permission);
            core.setOutput("trusted", String(trusted));
            core.notice(`${username}: permission=${permission}, trusted=${trusted}`);

  test:
    needs: check-author
    if: always() && (github.event_name == 'workflow_dispatch' || needs.check-author.outputs.trusted == 'true')
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 75

    strategy:
      fail-fast: false
      matrix:
        container: [1, 2, 3, 4]

    name: Python Unit Tests ${{ matrix.container }}

    services:
      mysql:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mariadb-admin ping -proot"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=10

      redis-cache:
        image: redis:7-alpine
        ports:
          - 6379/tcp

      redis-queue:
        image: redis:7-alpine
        ports:
          - 6379/tcp

    env:
      TZ: Asia/Kolkata
      NODE_ENV: production
      CI_SLOT: ${{ matrix.container }}
      DB_PORT: ${{ job.services.mysql.ports[3306] }}
      REDIS_CACHE_PORT: ${{ job.services.redis-cache.ports[6379] }}
      REDIS_QUEUE_PORT: ${{ job.services.redis-queue.ports[6379] }}
      FRAPPE_BRANCH: develop

    steps:
      - name: Checkout workflow helper
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve ERPNext source
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_REPO_URL: ${{ github.event.pull_request.head.repo.clone_url }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          CURRENT_REPO_URL: https://github.com/${{ github.repository }}.git
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request_target" ]; then
            echo "ERPNEXT_REPO_URL=$PR_REPO_URL" >> "$GITHUB_ENV"
            echo "ERPNEXT_SHA=$PR_SHA" >> "$GITHUB_ENV"
          else
            echo "ERPNEXT_REPO_URL=$CURRENT_REPO_URL" >> "$GITHUB_ENV"
            echo "ERPNEXT_SHA=$CURRENT_SHA" >> "$GITHUB_ENV"
          fi

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - name: Add test site host
        run: echo "127.0.0.1 test_site" | sudo tee -a /etc/hosts

      - name: Check Python and merge conflicts
        run: |
          python -m compileall -fq "$GITHUB_WORKSPACE"
          if grep -lr --exclude-dir=node_modules "^<<<<<<< " "$GITHUB_WORKSPACE"; then
            echo "Found merge conflicts"
            exit 1
          fi

      - name: Prepare warm bench
        run: bash "$GITHUB_WORKSPACE/.github/helper/fast-self-hosted-mariadb.sh"

      - name: Run shard
        run: |
          cd "$HOME/frappe-ci-cache/${RUNNER_NAME}/mariadb/frappe-bench"
          bench --site test_site run-parallel-tests \
            --lightmode \
            --app erpnext \
            --total-builds "${{ strategy.job-total }}" \
            --build-number "${{ matrix.container }}"
