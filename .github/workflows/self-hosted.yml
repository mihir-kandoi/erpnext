name: Trusted Runner Gate Test

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  check-author:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    outputs:
      trusted: ${{ steps.check.outputs.trusted }}
      permission: ${{ steps.check.outputs.permission }}
    steps:
      - id: check
        uses: actions/github-script@v7
        with:
          script: |
            const username = context.payload.pull_request.user.login;
            const { owner, repo } = context.repo;

            let permission = "none";
            try {
              const res = await github.rest.repos.getCollaboratorPermissionLevel({
                owner,
                repo,
                username,
              });
              permission = res.data.permission;
            } catch (e) {
              if (e.status !== 404) throw e;
            }

            const trusted = ["write", "maintain", "admin"].includes(permission);

            core.setOutput("permission", permission);
            core.setOutput("trusted", String(trusted));
            core.notice(`${username}: permission=${permission}, trusted=${trusted}`);

  community-github-hosted:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Community/default PR path running on GitHub-hosted runner"

  trusted-self-hosted:
    needs: check-author
    if: github.event_name == 'pull_request_target' && needs.check-author.outputs.trusted == 'true'
    runs-on: [macOS]
    steps:
      - run: |
          echo "Trusted PR path running on self-hosted runner"
          echo "Permission: ${{ needs.check-author.outputs.permission }}"
          whoami
          uname -a
