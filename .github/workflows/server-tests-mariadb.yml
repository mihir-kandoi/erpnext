name: Server (Mariadb)

on:
  repository_dispatch:
    types: [frappe-framework-change]
  pull_request:
    paths-ignore:
      - '**.js'
      - '**.css'
      - '**.svg'
      - '**.md'
      - '**.html'
      - 'crowdin.yml'
      - '.coderabbit.yml'
      - '.mergify.yml'
  schedule:
    # Run everday at midnight UTC / 5:30 IST
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      user:
        description: 'Frappe Framework repository user (add your username for forks)'
        required: true
        default: 'frappe'
        type: string
      branch:
        description: 'Frappe Framework branch'
        default: 'develop'
        required: false
        type: string
      runner_pool:
        description: 'Runner pool for manual fallback runs'
        default: 'self-hosted'
        required: false
        type: choice
        options:
          - self-hosted
          - github-hosted

permissions:
  contents: read

concurrency:
  group: server-mariadb-develop-${{ github.event_name }}-${{ github.event.number || github.event_name == 'workflow_dispatch' && github.run_id || '' }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.runner_pool != 'github-hosted' }}
    runs-on: [self-hosted, linux, x64, erpnext-ci]
    timeout-minutes: 60
    container:
      image: ubuntu:24.04
      options: --cpus 2 --memory 6g
      volumes:
        - /opt/erpnext-ci-cache/pip:/github/home/.cache/pip
        - /opt/erpnext-ci-cache/npm:/github/home/.npm
        - /opt/erpnext-ci-cache/yarn:/github/home/.cache/yarn
        - /opt/erpnext-ci-cache/wkhtmltox:/opt/erpnext-ci-cache/wkhtmltox
    defaults:
      run:
        shell: bash
    env:
      TZ: 'Asia/Kolkata'
      DEBIAN_FRONTEND: noninteractive
      NODE_ENV: "production"
      WITH_COVERAGE: ${{ github.event_name != 'pull_request' }}

    strategy:
      fail-fast: false

      matrix:
        container: [1, 2, 3, 4]

    name: Python Unit Tests

    services:
      mysql:
        image: mariadb:10.6
        env:
          TZ: 'Asia/Kolkata'
          MARIADB_ROOT_PASSWORD: 'root'
          # Disable durability guarantees that are unnecessary in a throwaway CI container.
          # innodb_flush_log_at_trx_commit=0 avoids an fsync on every commit (biggest win).
          # sync_binlog=0 skips binary-log syncs; innodb_doublewrite=0 skips the doublewrite buffer.
          MARIADB_EXTRA_FLAGS: --innodb-flush-log-at-trx-commit=0 --sync-binlog=0 --innodb-doublewrite=0
        options: --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot" --health-interval=5s --health-timeout=2s --health-retries=10

    steps:
      - name: Prepare job container
        run: |
          apt-get update
          apt-get install -y bash ca-certificates curl git sudo tar unzip wget xz-utils

      - name: Clone
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Check for valid Python & Merge Conflicts
        run: |
          python -m compileall -fq "${GITHUB_WORKSPACE}"
          if grep -lr --exclude-dir=node_modules "^<<<<<<< " "${GITHUB_WORKSPACE}"
              then echo "Found merge conflicts"
              exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true

      - name: Install Yarn
        run: npm install --global yarn

      - name: Add to Hosts
        run: echo "127.0.0.1 test_site" | sudo tee -a /etc/hosts

      - name: Adapt CI helper for job containers
        run: |
          sed -i 's/"db_host": "127.0.0.1"/"db_host": "mysql"/' .github/helper/site_config_mariadb.json
          sed -i 's/--host 127\.0\.0\.1/--host mysql/g' .github/helper/install.sh
          sed -i "s/'test_frappe'@'localhost'/'test_frappe'@'%'/g" .github/helper/install.sh
          sed -i 's#/tmp/wkhtmltox.deb#/opt/erpnext-ci-cache/wkhtmltox/wkhtmltox.deb#g' .github/helper/install.sh
          sed -i 's/sudo apt update/sudo apt-get update/g' .github/helper/install.sh
          sed -i 's/sudo apt remove /sudo apt-get remove -y /g' .github/helper/install.sh
          sed -i 's/sudo apt install /sudo apt-get install -y /g' .github/helper/install.sh

      - name: Install
        run: bash ${GITHUB_WORKSPACE}/.github/helper/install.sh
        env:
          DB: mariadb
          TYPE: server
          FRAPPE_USER: ${{ github.event.inputs.user }}
          FRAPPE_BRANCH: ${{ github.event.client_payload.sha || github.event.inputs.branch }}

      - name: Run Tests
        run: |
          cd ~/frappe-bench/
          coverage_flag=""
          if [ "$WITH_COVERAGE" = "true" ]; then coverage_flag="--with-coverage"; fi
          bench --site test_site run-parallel-tests --lightmode --app erpnext \
            --total-builds ${{ strategy.job-total }} \
            --build-number ${{ matrix.container }} \
            $coverage_flag
        env:
          TYPE: server


      - name: Show bench output
        if: ${{ always() }}
        run: cat ~/frappe-bench/bench_start.log || true

      - name: Upload coverage data
        if: ${{ env.WITH_COVERAGE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.container }}
          path: /github/home/frappe-bench/sites/coverage.xml

  test-github-hosted:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.runner_pool == 'github-hosted' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: 'Asia/Kolkata'
      NODE_ENV: "production"
      WITH_COVERAGE: ${{ github.event_name != 'pull_request' }}

    strategy:
      fail-fast: false

      matrix:
        container: [1, 2, 3, 4]

    name: Python Unit Tests

    services:
      mysql:
        image: mariadb:10.6
        env:
          TZ: 'Asia/Kolkata'
          MARIADB_ROOT_PASSWORD: 'root'
          # Disable durability guarantees that are unnecessary in a throwaway CI container.
          # innodb_flush_log_at_trx_commit=0 avoids an fsync on every commit (biggest win).
          # sync_binlog=0 skips binary-log syncs; innodb_doublewrite=0 skips the doublewrite buffer.
          MARIADB_EXTRA_FLAGS: --innodb-flush-log-at-trx-commit=0 --sync-binlog=0 --innodb-doublewrite=0
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Check for valid Python & Merge Conflicts
        run: |
          python -m compileall -fq "${GITHUB_WORKSPACE}"
          if grep -lr --exclude-dir=node_modules "^<<<<<<< " "${GITHUB_WORKSPACE}"
              then echo "Found merge conflicts"
              exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true

      - name: Add to Hosts
        run: echo "127.0.0.1 test_site" | sudo tee -a /etc/hosts

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Cache node modules
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Cache wkhtmltopdf
        uses: actions/cache@v4
        with:
          path: /tmp/wkhtmltox.deb
          key: wkhtmltox-0.12.6.1-2-jammy-amd64

      - name: Install
        run: bash ${GITHUB_WORKSPACE}/.github/helper/install.sh
        env:
          DB: mariadb
          TYPE: server
          FRAPPE_USER: ${{ github.event.inputs.user }}
          FRAPPE_BRANCH: ${{ github.event.client_payload.sha || github.event.inputs.branch }}

      - name: Run Tests
        run: |
          cd ~/frappe-bench/
          coverage_flag=""
          if [ "$WITH_COVERAGE" = "true" ]; then coverage_flag="--with-coverage"; fi
          bench --site test_site run-parallel-tests --lightmode --app erpnext \
            --total-builds ${{ strategy.job-total }} \
            --build-number ${{ matrix.container }} \
            $coverage_flag
        env:
          TYPE: server

      - name: Show bench output
        if: ${{ always() }}
        run: cat ~/frappe-bench/bench_start.log || true

      - name: Upload coverage data
        if: ${{ env.WITH_COVERAGE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.container }}
          path: /home/runner/frappe-bench/sites/coverage.xml

  coverage:
    name: Coverage Wrap Up
    needs: [test, test-github-hosted]
    if: ${{ always() && github.event_name != 'pull_request' && !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Upload coverage data
        uses: codecov/codecov-action@v4
        with:
          name: MariaDB
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true
