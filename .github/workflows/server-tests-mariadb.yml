name: Server (Mariadb)

on:
  repository_dispatch:
    types: [frappe-framework-change]
  pull_request:
    paths-ignore:
      - '**.js'
      - '**.css'
      - '**.svg'
      - '**.md'
      - '**.html'
      - 'crowdin.yml'
      - '.coderabbit.yml'
      - '.mergify.yml'
  schedule:
    # Run everday at midnight UTC / 5:30 IST
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      user:
        description: 'Frappe Framework repository user (add your username for forks)'
        required: true
        default: 'frappe'
        type: string
      branch:
        description: 'Frappe Framework branch'
        default: 'develop'
        required: false
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: server-mariadb-develop-${{ github.event_name }}-${{ github.event.number || github.event_name == 'workflow_dispatch' && github.run_id || '' }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: erpnext-arc
    timeout-minutes: 60
    container:
      image: ghcr.io/mihir-kandoi/erpnext-ci-mariadb:py3.14-node24-arc2
      credentials:
        username: ${{ secrets.GHCR_USERNAME || github.actor }}
        password: ${{ secrets.GHCR_TOKEN || github.token }}
      options: --cpus 2 --memory 6g
      volumes:
        - /opt/erpnext-ci-cache/pip:/github/home/.cache/pip
        - /opt/erpnext-ci-cache/npm:/github/home/.npm
        - /opt/erpnext-ci-cache/wkhtmltox:/opt/erpnext-ci-cache/wkhtmltox
        - /opt/erpnext-ci-cache/bench:/opt/erpnext-ci-cache/bench
    defaults:
      run:
        shell: bash
    env:
      TZ: 'Asia/Kolkata'
      DEBIAN_FRONTEND: noninteractive
      NODE_ENV: "production"
      WITH_COVERAGE: ${{ github.event_name != 'pull_request' }}
      PIP_CACHE_DIR: /github/home/.cache/pip
      npm_config_cache: /github/home/.npm
      YARN_CACHE_FOLDER: /github/home/.cache/yarn

    strategy:
      fail-fast: false

      matrix:
        container: [1, 2, 3, 4]

    name: Python Unit Tests (ARC)

    services:
      mysql:
        image: mariadb:10.6
        env:
          TZ: 'Asia/Kolkata'
          MARIADB_ROOT_PASSWORD: 'root'
          # Disable durability guarantees that are unnecessary in a throwaway CI container.
          # innodb_flush_log_at_trx_commit=0 avoids an fsync on every commit (biggest win).
          # sync_binlog=0 skips binary-log syncs; innodb_doublewrite=0 skips the doublewrite buffer.
          MARIADB_EXTRA_FLAGS: --innodb-flush-log-at-trx-commit=0 --sync-binlog=0 --innodb-doublewrite=0
        options: --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot" --health-interval=5s --health-timeout=2s --health-retries=10

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Check for valid Python & Merge Conflicts
        run: |
          python -m compileall -fq "${GITHUB_WORKSPACE}"
          if grep -lr --exclude-dir=node_modules "^<<<<<<< " "${GITHUB_WORKSPACE}"
              then echo "Found merge conflicts"
              exit 1
          fi

      - name: Add to Hosts
        run: echo "127.0.0.1 test_site" | sudo tee -a /etc/hosts

      - name: Install
        run: bash ${GITHUB_WORKSPACE}/.github/helper/install.sh
        env:
          DB: mariadb
          TYPE: server
          FRAPPE_USER: ${{ github.event.inputs.user }}
          FRAPPE_BRANCH: ${{ github.event.client_payload.sha || github.event.inputs.branch || 'develop' }}
          DB_HOST: mysql
          DB_USER_HOST: '%'
          WKHTMLTOX_DEB: /opt/erpnext-ci-cache/wkhtmltox/wkhtmltox.deb
          BENCH_CACHE_DIR: /opt/erpnext-ci-cache/bench
          SKIP_SYSTEM_SETUP: "1"
          SKIP_WKHTMLTOX_SETUP: "1"

      - name: Run Tests
        run: |
          su -m "${ERPNEXT_CI_USER:-frappe}" -s /bin/bash <<'EOF'
          cd ~/frappe-bench/
          coverage_flag=""
          if [ "$WITH_COVERAGE" = "true" ]; then coverage_flag="--with-coverage"; fi
          bench --site test_site run-parallel-tests --lightmode --app erpnext \
            --total-builds 6 \
            --build-number ${{ matrix.container }} \
            $coverage_flag
          EOF
        env:
          TYPE: server


      - name: Show bench output
        if: ${{ always() }}
        run: cat ~/frappe-bench/bench_start.log || true

      - name: Upload coverage data
        if: ${{ env.WITH_COVERAGE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.container }}
          path: /github/home/frappe-bench/sites/coverage.xml

  test-github-hosted:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: 'Asia/Kolkata'
      NODE_ENV: "production"
      WITH_COVERAGE: ${{ github.event_name != 'pull_request' }}

    strategy:
      fail-fast: false

      matrix:
        container: [5, 6]

    name: Python Unit Tests (GitHub Hosted)

    services:
      mysql:
        image: mariadb:10.6
        env:
          TZ: 'Asia/Kolkata'
          MARIADB_ROOT_PASSWORD: 'root'
          # Disable durability guarantees that are unnecessary in a throwaway CI container.
          # innodb_flush_log_at_trx_commit=0 avoids an fsync on every commit (biggest win).
          # sync_binlog=0 skips binary-log syncs; innodb_doublewrite=0 skips the doublewrite buffer.
          MARIADB_EXTRA_FLAGS: --innodb-flush-log-at-trx-commit=0 --sync-binlog=0 --innodb-doublewrite=0
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Check for valid Python & Merge Conflicts
        run: |
          python -m compileall -fq "${GITHUB_WORKSPACE}"
          if grep -lr --exclude-dir=node_modules "^<<<<<<< " "${GITHUB_WORKSPACE}"
              then echo "Found merge conflicts"
              exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true

      - name: Add to Hosts
        run: echo "127.0.0.1 test_site" | sudo tee -a /etc/hosts

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Cache node modules
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Cache wkhtmltopdf
        uses: actions/cache@v4
        with:
          path: /tmp/wkhtmltox.deb
          key: wkhtmltox-0.12.6.1-2-jammy-amd64

      - name: Install
        run: bash ${GITHUB_WORKSPACE}/.github/helper/install.sh
        env:
          DB: mariadb
          TYPE: server
          FRAPPE_USER: ${{ github.event.inputs.user }}
          FRAPPE_BRANCH: ${{ github.event.client_payload.sha || github.event.inputs.branch || 'develop' }}

      - name: Run Tests
        run: |
          cd ~/frappe-bench/
          coverage_flag=""
          if [ "$WITH_COVERAGE" = "true" ]; then coverage_flag="--with-coverage"; fi
          bench --site test_site run-parallel-tests --lightmode --app erpnext \
            --total-builds 6 \
            --build-number ${{ matrix.container }} \
            $coverage_flag
        env:
          TYPE: server

      - name: Show bench output
        if: ${{ always() }}
        run: cat ~/frappe-bench/bench_start.log || true

      - name: Upload coverage data
        if: ${{ env.WITH_COVERAGE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.container }}
          path: /home/runner/frappe-bench/sites/coverage.xml

  coverage:
    name: Coverage Wrap Up
    needs: [test, test-github-hosted]
    if: ${{ always() && github.event_name != 'pull_request' && !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Upload coverage data
        uses: codecov/codecov-action@v4
        with:
          name: MariaDB
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true
