name: Server (Mariadb)

on:
  repository_dispatch:
    types: [frappe-framework-change]
  pull_request:
    paths-ignore:
      - '**.js'
      - '**.css'
      - '**.svg'
      - '**.md'
      - '**.html'
      - 'crowdin.yml'
      - '.coderabbit.yml'
      - '.mergify.yml'
  schedule:
    # Run everday at midnight UTC / 5:30 IST
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      user:
        description: 'Frappe Framework repository user (add your username for forks)'
        required: true
        default: 'frappe'
        type: string
      branch:
        description: 'Frappe Framework branch'
        default: 'develop'
        required: false
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: server-mariadb-develop-${{ github.event_name }}-${{ github.event.number || github.event_name == 'workflow_dispatch' && github.run_id || '' }}
  cancel-in-progress: true

# Shared across both jobs. Both run in the SAME arc4 container so the bench lives at the
# identical path (/home/ci/frappe-bench) on the GitHub-hosted setup runner and the self-hosted
# test runners — that's what makes the packaged Python venv portable between them.
env:
  TZ: 'Asia/Kolkata'
  DEBIAN_FRONTEND: noninteractive
  NODE_ENV: "production"
  WITH_COVERAGE: ${{ github.event_name != 'pull_request' }}
  ERPNEXT_CI_USER: ci
  PIP_CACHE_DIR: /home/ci/.cache/pip
  npm_config_cache: /home/ci/.cache/npm
  YARN_CACHE_FOLDER: /home/ci/.cache/yarn
  UV_CACHE_DIR: /home/ci/.cache/uv

jobs:
  # Build the bench (clone + pip + yarn + assets) and reinstall test_site ONCE, on a free
  # GitHub-hosted runner, then publish the whole bench (with a DB dump baked in) as an artifact.
  # The expensive, non-parallelisable work happens here exactly once instead of on every shard.
  setup:
    name: Build & reinstall (setup)
    # Self-hosted: same arc4 container + /home/ci path + 127.0.0.1 DB as the test shards, so the
    # packaged bench (and its venv) transplants cleanly. GitHub-hosted forces HOME=/github/home
    # and routes services by label, which broke venv portability and the DB connection.
    runs-on: erpnext-arc
    timeout-minutes: 40
    container:
      image: ghcr.io/mihir-kandoi/erpnext-ci-mariadb:py3.14-node24-arc5
      credentials:
        username: ${{ secrets.GHCR_USERNAME || github.actor }}
        password: ${{ secrets.GHCR_TOKEN || github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Check for valid Python & Merge Conflicts
        run: |
          python -m compileall -fq "${GITHUB_WORKSPACE}"
          if grep -lr --exclude-dir=node_modules "^<<<<<<< " "${GITHUB_WORKSPACE}"
              then echo "Found merge conflicts"
              exit 1
          fi

      - name: Add to Hosts
        run: echo "127.0.0.1 test_site" | sudo tee -a /etc/hosts

      # MariaDB runs in-container on a datadir OUTSIDE the bench, because install.sh's next step
      # does `rm -rf ~/frappe-bench`. After the reinstall, the datadir is moved into the bench so
      # it ships in the artifact — test shards then start an already-loaded server (no restore).
      - name: Start DB
        run: bash ${GITHUB_WORKSPACE}/.github/helper/start-db.sh
        env:
          SKIP_SYSTEM_SETUP: "1"
          CI_DB_DATADIR: /home/ci/db-data

      - name: Install
        run: bash ${GITHUB_WORKSPACE}/.github/helper/install.sh
        env:
          DB: mariadb
          TYPE: server
          FRAPPE_USER: ${{ github.event.inputs.user }}
          FRAPPE_BRANCH: ${{ github.event.client_payload.sha || github.event.inputs.branch || 'develop' }}
          DB_HOST: 127.0.0.1
          DB_USER_HOST: '%'
          WKHTMLTOX_DEB: /tmp/wkhtmltox.deb
          SKIP_SYSTEM_SETUP: "1"
          SKIP_WKHTMLTOX_SETUP: "1"

      # Clean shutdown (consistent InnoDB datadir), then stage it inside the bench for packaging.
      - name: Stop DB and stage datadir
        run: |
          mariadb-admin -h 127.0.0.1 -P 3306 -u root -proot shutdown || true
          for _ in $(seq 1 30); do [ -f /home/ci/db-data/mysqld.pid ] || break; sleep 1; done
          mv /home/ci/db-data /home/ci/frappe-bench/mariadb-data

      # Package the whole bench (apps, venv, node_modules, sites, the DB dump, and hydrate.sh)
      # into one artifact for the test shards to consume.
      - name: Package bench for test shards
        run: |
          cp "${GITHUB_WORKSPACE}/.github/helper/hydrate.sh" /home/ci/frappe-bench/hydrate.sh
          cp "${GITHUB_WORKSPACE}/.github/helper/start-db.sh" /home/ci/frappe-bench/start-db.sh
          # Exclude what server tests don't need: the apps' git history and node_modules (frontend
          # deps; the built assets under sites/assets are already included). The mariadb-data
          # datadir IS included — that's the pre-loaded DB the shards start on instead of restoring.
          tar czpf "${GITHUB_WORKSPACE}/bench.tar.gz" -C /home/ci \
            --exclude='.git' --exclude='node_modules' frappe-bench
          ls -lh "${GITHUB_WORKSPACE}/bench.tar.gz"

      - name: Upload bench artifact
        uses: actions/upload-artifact@v4
        with:
          name: bench-and-db
          path: bench.tar.gz
          retention-days: 1
          compression-level: 0

  # Fan-out: each shard downloads the bench, untars it, restores the DB dump, and runs its
  # slice of the suite. No clone, no build, no reinstall on the self-hosted boxes.
  test:
    name: Python Unit Tests (ARC)
    needs: setup
    runs-on: erpnext-arc
    timeout-minutes: 60
    container:
      image: ghcr.io/mihir-kandoi/erpnext-ci-mariadb:py3.14-node24-arc5
      credentials:
        username: ${{ secrets.GHCR_USERNAME || github.actor }}
        password: ${{ secrets.GHCR_TOKEN || github.token }}
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        container: [1, 2, 3, 4]

    steps:
      - name: Download bench artifact
        uses: actions/download-artifact@v4
        with:
          name: bench-and-db

      - name: Add to Hosts
        run: echo "127.0.0.1 test_site" | sudo tee -a /etc/hosts

      # -p preserves the ci (uid 1001) ownership baked into the tar, so bench runs as ci cleanly.
      - name: Untar bench
        run: |
          tar xzpf "${GITHUB_WORKSPACE}/bench.tar.gz" -C /home/ci
          ls -ld /home/ci/frappe-bench

      - name: Hydrate (DB up + restore + bench start)
        run: bash /home/ci/frappe-bench/hydrate.sh
        env:
          DB_HOST: 127.0.0.1
          SKIP_SYSTEM_SETUP: "1"
          CI_BASELINE_BACKUP: /home/ci/frappe-bench/test_site-db.sql.gz

      - name: Run Tests
        run: |
          su -m "${ERPNEXT_CI_USER:-frappe}" -s /bin/bash <<'EOF'
          cd ~/frappe-bench/
          coverage_flag=""
          if [ "$WITH_COVERAGE" = "true" ]; then coverage_flag="--with-coverage"; fi
          bench --site test_site run-parallel-tests --lightmode --app erpnext \
            --total-builds 4 \
            --build-number ${{ matrix.container }} \
            $coverage_flag
          EOF
        env:
          TYPE: server

      - name: Show bench output
        if: ${{ always() }}
        run: cat ~/frappe-bench/bench_start.log || true

      - name: Upload coverage data
        if: ${{ env.WITH_COVERAGE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.container }}
          path: /home/ci/frappe-bench/sites/coverage.xml

  coverage:
    name: Coverage Wrap Up
    needs: [test]
    if: ${{ always() && github.event_name != 'pull_request' && !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Upload coverage data
        uses: codecov/codecov-action@v4
        with:
          name: MariaDB
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true
